[project]
name = "aifd"
version = "0.2.1"
description = "List AI coding sessions (Claude Code, Codex, Cursor) for the current directory across all your AI tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "xunull" }]
keywords = ["ai", "claude", "codex", "cursor", "cli", "session", "history"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
aifd = "aifd.cli:cli"

[project.urls]
Homepage = "https://github.com/xunull/aifd"
Repository = "https://github.com/xunull/aifd"
Issues = "https://github.com/xunull/aifd/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aifd"]

[tool.hatch.build.targets.sdist]
include = [
    "aifd/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "TODOS.md",
]
exclude = [
    ".claude/",
    ".github/",
    ".python-version",
    "dist/",
    ".venv/",
    "**/__pycache__/",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
