[project]
name = "aifd"
version = "0.14.0"
description = "List AI coding sessions (Claude Code, Codex, Cursor, OpenCode) for the current directory across all your AI tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "xunull" }]
keywords = ["ai", "claude", "codex", "cursor", "cli", "session", "history"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    # v0.6 aifd vault watch needs a filesystem-event watcher. watchdog wraps
    # native APIs (macOS FSEvents, Linux inotify, Windows ReadDirectoryChangesW)
    # so we get OS-level events without polling. Picked over PyObjC (macOS-only)
    # and rolling our own (re-inventing 10 years of edge-case fixes).
    "watchdog>=4.0",
    # v0.7 vault watch events stream needs to parse user-authored YAML
    # for webhook configuration (~/.aifd/webhooks.yaml). PyYAML is the
    # boring-tech standard; alternatives (ruamel, strictyaml) are heavier
    # for no gain at this scope.
    "pyyaml>=6.0",
    # v0.8 aifd ai reflect speaks to LLMs through LiteLLM, a 100+ provider
    # router that normalizes OpenAI / Anthropic / Gemini / DeepSeek / Zhipu /
    # DashScope / Volcengine Ark / ollama / vLLM / Azure / Bedrock under one
    # OpenAI-shaped completion() call. We rejected hand-rolling a stdlib
    # urllib client because users want vendor flexibility, and we rejected
    # openai-sdk because it covers only ~50% of the LLM endpoints our users
    # ask about (the Chinese-ecosystem providers in particular have OpenAI-
    # compat quirks that openai-sdk doesn't paper over).
    "litellm>=1.50",
    # v0.12 `aifd quota` does one synchronous GET to MiniMax's coding-plan
    # usage endpoint. httpx is already in the tree transitively (via litellm →
    # openai), so declaring it direct adds no install weight and stops us
    # depending on a transitive we don't control.
    "httpx>=0.27",
]

[project.scripts]
aifd = "aifd.cli:cli"

[project.urls]
Homepage = "https://github.com/xunull/aifd"
Repository = "https://github.com/xunull/aifd"
Issues = "https://github.com/xunull/aifd/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aifd"]

[tool.hatch.build.targets.sdist]
include = [
    "aifd/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "TODOS.md",
]
exclude = [
    ".claude/",
    ".github/",
    ".python-version",
    "dist/",
    ".venv/",
    "**/__pycache__/",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live_api: hits a real external LLM API (DeepSeek / OpenAI / etc.). Opt in via provider env var (e.g. DEEPSEEK_API_KEY) + explicit pytest -m live_api.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Rotation playbooks contain intentional Chinese prose with fullwidth
# punctuation; that's idiomatic, not ambiguous.
"aifd/vault/playbooks.py" = ["RUF001", "RUF002", "RUF003"]
# Reflection prompt has intentional Chinese rules string with fullwidth
# punctuation; that's idiomatic for the LLM to follow.
"aifd/insights/reflection_prompt.py" = ["RUF001", "RUF002", "RUF003"]
# Habits prompt + CLI fallback hints use the same intentional fullwidth
# Chinese punctuation as the reflection counterpart.
"aifd/insights/habits_prompt.py" = ["RUF001", "RUF002", "RUF003"]
"aifd/insights/habits.py" = ["RUF001", "RUF002", "RUF003"]
"aifd/cli/ai/habits.py" = ["RUF001", "RUF002", "RUF003"]
"aifd/render.py" = ["RUF001", "RUF002", "RUF003"]
# `aifd quota` output uses a fullwidth comma in the Chinese status line.
"aifd/cli/quota.py" = ["RUF001", "RUF002", "RUF003"]
# `aifd cosmos` HTML hint has a Chinese legend with fullwidth punctuation.
"aifd/render_cosmos.py" = ["RUF001", "RUF002", "RUF003"]
# `aifd cosmos` 2.5D module: Chinese docstring/comments + HTML hint.
"aifd/render_cosmos_25d.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
