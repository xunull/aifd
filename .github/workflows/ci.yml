name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check aifd/ tests/

      - name: Type check with mypy
        run: uv run mypy aifd/

      - name: Run pytest
        run: uv run pytest --cov=aifd --cov-report=term-missing
